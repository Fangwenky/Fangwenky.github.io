<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <style>
        .box { fill: #ffffff; stroke: #e2e8f0; stroke-width: 2px; rx: 8px; }
        .box-title { font-family: sans-serif; font-weight: bold; font-size: 16px; fill: #1e293b; }
        .box-text { font-family: sans-serif; font-size: 14px; fill: #64748b; }
        .line { stroke: #cbd5e1; stroke-width: 2px; fill: none; }
        .stage-badge { font-family: sans-serif; font-size: 12px; font-weight: bold; fill: #ffffff; }
    </style>
    
    <!-- 背景 -->
    <rect width="100%" height="100%" fill="#f8fafc" />

    <!-- 中心节点 -->
    <rect x="300" y="20" width="200" height="60" class="box" stroke="#3b82f6" fill="#eff6ff" />
    <text x="400" y="55" text-anchor="middle" class="box-title" font-size="18">大二 AI 学习计划</text>

    <!-- 连接线 -->
    <path d="M400 80 L400 120" class="line" /> <!-- 主干 -->
    <path d="M100 120 L700 120" class="line" /> <!-- 横向分叉 -->
    <path d="M100 120 L100 160" class="line" />
    <path d="M300 120 L300 160" class="line" />
    <path d="M500 120 L500 160" class="line" />
    <path d="M700 120 L700 160" class="line" />

    <!-- 阶段 1: 数学基础 -->
    <g transform="translate(10, 160)">
        <rect width="180" height="280" class="box" stroke="#f43f5e" />
        <rect width="80" height="24" x="50" y="-12" rx="12" fill="#f43f5e" />
        <text x="90" y="5" text-anchor="middle" class="stage-badge">Stage 1</text>
        
        <text x="90" y="40" text-anchor="middle" class="box-title">数学内功</text>
        <line x1="20" y1="60" x2="160" y2="60" stroke="#f1f5f9" />
        
        <text x="20" y="90" class="box-text">• 线性代数 (SVD)</text>
        <text x="20" y="120" class="box-text">• 微积分 (梯度)</text>
        <text x="20" y="150" class="box-text">• 概率论 (贝叶斯)</text>
        <text x="20" y="180" class="box-text">• 凸优化基础</text>
    </g>

    <!-- 阶段 2: 机器学习 -->
    <g transform="translate(210, 160)">
        <rect width="180" height="280" class="box" stroke="#f59e0b" />
        <rect width="80" height="24" x="50" y="-12" rx="12" fill="#f59e0b" />
        <text x="90" y="5" text-anchor="middle" class="stage-badge">Stage 2</text>

        <text x="90" y="40" text-anchor="middle" class="box-title">手写 ML 算法</text>
        <line x1="20" y1="60" x2="160" y2="60" stroke="#f1f5f9" />

        <text x="20" y="90" class="box-text">• 纯 NumPy 实现</text>
        <text x="20" y="120" class="box-text">• 线性/逻辑回归</text>
        <text x="20" y="150" class="box-text">• K-Means 聚类</text>
        <text x="20" y="180" class="box-text">• BP 神经网络</text>
    </g>

    <!-- 阶段 3: 深度学习 -->
    <g transform="translate(410, 160)">
        <rect width="180" height="280" class="box" stroke="#8b5cf6" />
        <rect width="80" height="24" x="50" y="-12" rx="12" fill="#8b5cf6" />
        <text x="90" y="5" text-anchor="middle" class="stage-badge">Stage 3</text>

        <text x="90" y="40" text-anchor="middle" class="box-title">PyTorch 进阶</text>
        <line x1="20" y1="60" x2="160" y2="60" stroke="#f1f5f9" />

        <text x="20" y="90" class="box-text">• ResNet 复现</text>
        <text x="20" y="120" class="box-text">• Transformer</text>
        <text x="20" y="150" class="box-text">• 论文精读</text>
        <text x="20" y="180" class="box-text">• 项目实战</text>
    </g>

    <!-- 阶段 4: 工程化 -->
    <g transform="translate(610, 160)">
        <rect width="180" height="280" class="box" stroke="#10b981" />
        <rect width="80" height="24" x="50" y="-12" rx="12" fill="#10b981" />
        <text x="90" y="5" text-anchor="middle" class="stage-badge">Stage 4</text>

        <text x="90" y="40" text-anchor="middle" class="box-title">工程素养</text>
        <line x1="20" y1="60" x2="160" y2="60" stroke="#f1f5f9" />

        <text x="20" y="90" class="box-text">• Linux/SSH</text>
        <text x="20" y="120" class="box-text">• Git 工作流</text>
        <text x="20" y="150" class="box-text">• Docker 容器</text>
        <text x="20" y="180" class="box-text">• HuggingFace</text>
    </g>
</svg>
