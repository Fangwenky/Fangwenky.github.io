<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Agent Tools Learning Notes Cover</title>
  <desc id="desc">An agent loop connecting planning, tools, observation, and answer.</desc>
  <rect width="960" height="540" fill="#fff8f3"/>
  <text x="112" y="110" font-family="Noto Sans SC, Arial, sans-serif" font-size="38" font-weight="700" fill="#5d4037">Agent + Tools</text>
  <text x="114" y="146" font-family="Noto Sans SC, Arial, sans-serif" font-size="20" fill="#8d6e63">plan, act, observe, refine</text>
  <g fill="#fff" stroke="#d7ccc8" stroke-width="3">
    <circle cx="254" cy="292" r="72"/>
    <circle cx="480" cy="206" r="72"/>
    <circle cx="706" cy="292" r="72"/>
    <circle cx="480" cy="382" r="72"/>
  </g>
  <g font-family="Noto Sans SC, Arial, sans-serif" text-anchor="middle" fill="#5d4037">
    <text x="254" y="286" font-size="24" font-weight="700">Plan</text>
    <text x="254" y="316" font-size="16">task</text>
    <text x="480" y="200" font-size="24" font-weight="700">Tool</text>
    <text x="480" y="230" font-size="16">call</text>
    <text x="706" y="286" font-size="24" font-weight="700">Observe</text>
    <text x="706" y="316" font-size="16">result</text>
    <text x="480" y="376" font-size="24" font-weight="700">Answer</text>
    <text x="480" y="406" font-size="16">or loop</text>
  </g>
  <g fill="none" stroke="#e76f51" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M312 250 C348 220 386 206 402 206"/>
    <path d="M558 206 C612 212 634 236 656 258"/>
    <path d="M658 334 C612 366 560 380 552 382"/>
    <path d="M408 382 C350 376 324 344 304 326"/>
  </g>
</svg>
