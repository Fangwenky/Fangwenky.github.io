<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e1e2e"/>
            <stop offset="100%" stop-color="#2a2a3e"/>
        </linearGradient>
    </defs>
    <rect width="800" height="450" fill="url(#bg-grad)"/>
    
    <!-- 装饰网格 -->
    <g stroke="#3f3f5a" stroke-width="1" opacity="0.3">
        <line x1="50" y1="50" x2="50" y2="400"/>
        <line x1="50" y1="400" x2="750" y2="400"/>
    </g>

    <!-- 散点数据 -->
    <g fill="#4cc9f0" opacity="0.6">
        <circle cx="100" cy="350" r="4"/><circle cx="150" cy="320" r="4"/>
        <circle cx="200" cy="300" r="4"/><circle cx="250" cy="280" r="4"/>
        <circle cx="300" cy="240" r="4"/><circle cx="350" cy="200" r="4"/>
        <circle cx="400" cy="180" r="4"/><circle cx="450" cy="150" r="4"/>
        <circle cx="500" cy="120" r="4"/><circle cx="550" cy="100" r="4"/>
        <circle cx="600" cy="80" r="4"/><circle cx="650" cy="50" r="4"/>
        <!-- 增加一些噪点 -->
        <circle cx="120" cy="360" r="3"/><circle cx="220" cy="270" r="3"/>
        <circle cx="320" cy="260" r="3"/><circle cx="420" cy="140" r="3"/>
        <circle cx="520" cy="160" r="3"/><circle cx="620" cy="90" r="3"/>
    </g>

    <!-- 回归线 -->
    <line x1="80" y1="380" x2="680" y2="40" stroke="#f72585" stroke-width="4" stroke-linecap="round"/>

    <!-- 标题文字 -->
    <text x="400" y="240" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="white" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">
        LINEAR REGRESSION
    </text>
    <text x="400" y="280" text-anchor="middle" font-family="monospace" font-size="20" fill="#a0a0b0">
        From Scratch with NumPy
    </text>
    
    <!-- 代码装饰 -->
    <rect x="500" y="320" width="250" height="80" rx="5" fill="#111" opacity="0.8" stroke="#555"/>
    <text x="520" y="350" font-family="monospace" font-size="14" fill="#4cc9f0">w = w - lr * dw</text>
    <text x="520" y="375" font-family="monospace" font-size="14" fill="#4cc9f0">b = b - lr * db</text>
</svg>
