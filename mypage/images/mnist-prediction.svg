<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
    <style>
        .label { font-family: sans-serif; font-size: 12px; fill: #64748b; }
        .prob-bar-bg { fill: #f1f5f9; }
        .prob-bar-fill { fill: #3b82f6; }
        .correct { fill: #10b981; }
        .digit-box { fill: black; }
        .digit-text { font-family: monospace; font-size: 40px; fill: white; }
        /* 代码文字样式 */
        .code-text { font-family: 'Menlo', 'Monaco', 'Courier New', monospace; font-size: 14px; }
    </style>
    
    <!-- 背景 -->
    <rect width="100%" height="100%" fill="white"/>

    <!-- 第一组: 数字 7 -->
    <g transform="translate(50, 50)">
        <rect width="60" height="60" class="digit-box" rx="4"/>
        <text x="30" y="45" text-anchor="middle" class="digit-text">7</text>
        
        <g transform="translate(80, 0)">
            <text x="0" y="15" class="label">Pred: 7</text>
            <rect x="0" y="25" width="100" height="10" class="prob-bar-bg"/>
            <rect x="0" y="25" width="98" height="10" class="correct"/>
            <text x="110" y="34" class="label" fill="#10b981">98%</text>
        </g>
    </g>

    <!-- 第二组: 数字 2 -->
    <g transform="translate(50, 130)">
        <rect width="60" height="60" class="digit-box" rx="4"/>
        <text x="30" y="45" text-anchor="middle" class="digit-text">2</text>
        
        <g transform="translate(80, 0)">
            <text x="0" y="15" class="label">Pred: 2</text>
            <rect x="0" y="25" width="100" height="10" class="prob-bar-bg"/>
            <rect x="0" y="25" width="92" height="10" class="correct"/>
            <text x="110" y="34" class="label" fill="#10b981">92%</text>
        </g>
    </g>

    <!-- 第三组: 数字 1 -->
    <g transform="translate(50, 210)">
        <rect width="60" height="60" class="digit-box" rx="4"/>
        <text x="30" y="45" text-anchor="middle" class="digit-text">1</text>
        
        <g transform="translate(80, 0)">
            <text x="0" y="15" class="label">Pred: 1</text>
            <rect x="0" y="25" width="100" height="10" class="prob-bar-bg"/>
            <rect x="0" y="25" width="99" height="10" class="correct"/>
            <text x="110" y="34" class="label" fill="#10b981">99%</text>
        </g>
    </g>

    <!-- 右侧：代码片段 (这里修正了坐标) -->
    <g transform="translate(350, 50)">
        <!-- 背景黑框 -->
        <rect width="300" height="220" fill="#1e293b" rx="8" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
        
        <!-- Mac 风格的红黄绿点 (坐标修正为相对于黑框左上角) -->
        <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
        <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
        <circle cx="60" cy="20" r="6" fill="#27c93f"/>
        
        <!-- 代码文字 (坐标修正：x=20 而不是 x=370) -->
        <text x="20" y="60" class="code-text" fill="#e2e8f0">model.eval()</text>
        <text x="20" y="90" class="code-text" fill="#c084fc">with torch.no_grad():</text>
        <text x="20" y="120" class="code-text" fill="#e2e8f0">    output = model(img)</text>
        <text x="20" y="150" class="code-text" fill="#e2e8f0">    pred = output.argmax()</text>
        <text x="20" y="180" class="code-text" fill="#4ade80">    print(f"Got: {pred}")</text>
    </g>
</svg>
