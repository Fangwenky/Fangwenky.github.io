<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="node-glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="#60a5fa" stop-opacity="1"/>
            <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="bg-nn" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#1e1e2e"/>
        </linearGradient>
    </defs>
    
    <!-- 背景 -->
    <rect width="100%" height="100%" fill="url(#bg-nn)"/>
    
    <!-- 连接线 (Input -> Hidden) -->
    <g stroke="#334155" stroke-width="2" opacity="0.6">
        <line x1="150" y1="150" x2="400" y2="100" />
        <line x1="150" y1="150" x2="400" y2="225" />
        <line x1="150" y1="150" x2="400" y2="350" />
        <line x1="150" y1="300" x2="400" y2="100" />
        <line x1="150" y1="300" x2="400" y2="225" />
        <line x1="150" y1="300" x2="400" y2="350" />
    </g>

    <!-- 连接线 (Hidden -> Output) -->
    <g stroke="#475569" stroke-width="2" opacity="0.6">
        <line x1="400" y1="100" x2="650" y2="225" />
        <line x1="400" y1="225" x2="650" y2="225" />
        <line x1="400" y1="350" x2="650" y2="225" />
    </g>

    <!-- 输入层节点 -->
    <circle cx="150" cy="150" r="20" fill="#3b82f6" stroke="#bfdbfe" stroke-width="2"/>
    <text x="150" y="155" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">x1</text>
    <circle cx="150" cy="300" r="20" fill="#3b82f6" stroke="#bfdbfe" stroke-width="2"/>
    <text x="150" y="305" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">x2</text>
    <text x="150" y="360" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Input Layer</text>

    <!-- 隐藏层节点 -->
    <circle cx="400" cy="100" r="25" fill="url(#node-glow)"/>
    <circle cx="400" cy="225" r="25" fill="url(#node-glow)"/>
    <circle cx="400" cy="350" r="25" fill="url(#node-glow)"/>
    <circle cx="400" cy="100" r="15" fill="#1d4ed8"/>
    <circle cx="400" cy="225" r="15" fill="#1d4ed8"/>
    <circle cx="400" cy="350" r="15" fill="#1d4ed8"/>
    <text x="400" y="400" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Hidden Layer</text>

    <!-- 输出层节点 -->
    <circle cx="650" cy="225" r="20" fill="#10b981" stroke="#a7f3d0" stroke-width="2"/>
    <text x="650" y="230" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">y</text>
    <text x="650" y="280" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="14">Output</text>

    <!-- 标题 -->
    <text x="400" y="50" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24" font-weight="bold" letter-spacing="2">NEURAL NETWORK</text>
</svg>
