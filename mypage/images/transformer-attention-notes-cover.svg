<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Transformer Attention Notes Cover</title>
  <desc id="desc">A warm notebook-style diagram of query, key, and value attention paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f3"/>
      <stop offset="1" stop-color="#ffe9d9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="5" dy="7" stdDeviation="0" flood-color="#d7ccc8" flood-opacity="0.9"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <path d="M0 72 C120 42 226 112 342 78 S590 40 712 88 852 112 960 70" fill="none" stroke="#e9c46a" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
  <g filter="url(#shadow)">
    <rect x="88" y="88" width="784" height="364" rx="18" fill="#fff" stroke="#d7ccc8" stroke-width="3"/>
    <path d="M138 168 H822 M138 238 H822 M138 308 H822 M138 378 H822" stroke="#f4e4da" stroke-width="3"/>
  </g>
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M238 314 C338 210 452 214 560 300" stroke="#e76f51"/>
    <path d="M238 314 C382 366 498 364 690 232" stroke="#2a9d8f"/>
    <path d="M238 314 C380 288 512 170 690 232" stroke="#264653"/>
  </g>
  <g font-family="Noto Sans SC, Arial, sans-serif" text-anchor="middle">
    <circle cx="238" cy="314" r="46" fill="#fff9e6" stroke="#e76f51" stroke-width="4"/>
    <text x="238" y="324" font-size="28" fill="#5d4037" font-weight="700">Q</text>
    <circle cx="560" cy="300" r="46" fill="#e8f5f2" stroke="#2a9d8f" stroke-width="4"/>
    <text x="560" y="310" font-size="28" fill="#5d4037" font-weight="700">K</text>
    <circle cx="690" cy="232" r="46" fill="#eef1fb" stroke="#264653" stroke-width="4"/>
    <text x="690" y="242" font-size="28" fill="#5d4037" font-weight="700">V</text>
  </g>
  <text x="120" y="128" font-family="Noto Sans SC, Arial, sans-serif" font-size="34" font-weight="700" fill="#5d4037">Attention</text>
  <text x="120" y="424" font-family="Noto Sans SC, Arial, sans-serif" font-size="24" fill="#8d6e63">softmax(QK^T / sqrt(d)) V</text>
</svg>
