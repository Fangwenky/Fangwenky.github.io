<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="white" stroke="#ddd" stroke-width="1"/>
    
    <!-- 坐标轴 -->
    <line x1="50" y1="350" x2="550" y2="350" stroke="black" stroke-width="2"/>
    <line x1="50" y1="350" x2="50" y2="50" stroke="black" stroke-width="2"/>
    <text x="540" y="380" font-family="sans-serif" font-size="12">X</text>
    <text x="20" y="60" font-family="sans-serif" font-size="12">y</text>

    <!-- 散点 -->
    <g fill="#3b82f6" opacity="0.7">
        <!-- 随机生成的散点模拟 -->
        <circle cx="80" cy="330" r="3"/><circle cx="120" cy="300" r="3"/>
        <circle cx="160" cy="280" r="3"/><circle cx="200" cy="260" r="3"/>
        <circle cx="240" cy="230" r="3"/><circle cx="280" cy="210" r="3"/>
        <circle cx="320" cy="190" r="3"/><circle cx="360" cy="160" r="3"/>
        <circle cx="400" cy="140" r="3"/><circle cx="440" cy="110" r="3"/>
        <circle cx="480" cy="90" r="3"/><circle cx="520" cy="70" r="3"/>
        <circle cx="100" cy="310" r="3"/><circle cx="140" cy="290" r="3"/>
        <circle cx="180" cy="270" r="3"/><circle cx="220" cy="240" r="3"/>
        <circle cx="260" cy="220" r="3"/><circle cx="300" cy="190" r="3"/>
        <circle cx="340" cy="180" r="3"/><circle cx="380" cy="150" r="3"/>
        <circle cx="420" cy="130" r="3"/><circle cx="460" cy="100" r="3"/>
        <circle cx="500" cy="80" r="3"/>
    </g>

    <!-- 拟合红线 -->
    <line x1="50" y1="350" x2="550" y2="50" stroke="#ef4444" stroke-width="3"/>

    <!-- 图例 -->
    <rect x="420" y="300" width="120" height="60" fill="white" stroke="#ccc" rx="4"/>
    <circle cx="435" cy="320" r="3" fill="#3b82f6"/>
    <text x="450" y="324" font-family="sans-serif" font-size="12">True Data</text>
    <line x1="425" y1="345" x2="445" y2="345" stroke="#ef4444" stroke-width="3"/>
    <text x="450" y="349" font-family="sans-serif" font-size="12">Prediction</text>

    <!-- 标题 -->
    <text x="300" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">Linear Regression Fit</text>
</svg>
