<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">LoRA Fine Tuning Cover</title>
  <desc id="desc">A frozen model matrix with a small low-rank adapter branch.</desc>
  <rect width="960" height="540" fill="#fff8f3"/>
  <text x="104" y="110" font-family="Noto Sans SC, Arial, sans-serif" font-size="38" font-weight="700" fill="#5d4037">LoRA Fine-tuning</text>
  <text x="106" y="146" font-family="Noto Sans SC, Arial, sans-serif" font-size="20" fill="#8d6e63">freeze W, train low-rank delta</text>
  <rect x="126" y="218" width="268" height="174" rx="18" fill="#eef1fb" stroke="#264653" stroke-width="4"/>
  <text x="260" y="314" text-anchor="middle" font-family="Noto Sans SC, Arial, sans-serif" font-size="34" font-weight="700" fill="#264653">W frozen</text>
  <rect x="520" y="202" width="90" height="210" rx="14" fill="#fff9e6" stroke="#e9c46a" stroke-width="4"/>
  <rect x="646" y="254" width="190" height="86" rx="14" fill="#ffe9d9" stroke="#e76f51" stroke-width="4"/>
  <text x="565" y="314" text-anchor="middle" font-family="Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#5d4037">B</text>
  <text x="741" y="307" text-anchor="middle" font-family="Noto Sans SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#5d4037">A</text>
  <g fill="none" stroke="#2a9d8f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M408 305 H504"/>
    <path d="M494 292 l14 13-14 13"/>
    <path d="M616 305 H638"/>
    <path d="M628 292 l14 13-14 13"/>
  </g>
  <text x="500" y="454" font-family="Noto Sans SC, Arial, sans-serif" font-size="24" fill="#8d6e63">W' = W + B A</text>
</svg>
