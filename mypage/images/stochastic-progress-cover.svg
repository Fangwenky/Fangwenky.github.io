<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>

    <!-- 轨迹线的渐变 -->
    <linearGradient id="line-gradient-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="line-gradient-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e879f9;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="line-gradient-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:1" />
    </linearGradient>

    <!-- 网格图案 -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3"/>
    </pattern>

    <!-- 字体阴影 -->
    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 1. 背景 -->
  <rect width="100%" height="100%" fill="url(#bg-gradient)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- 2. 装饰性数学曲线 (高斯分布) -->
  <path d="M 0 380 Q 200 380 300 350 T 400 150 T 500 350 T 800 380" 
        fill="none" stroke="#475569" stroke-width="2" opacity="0.3" stroke-dasharray="10,5"/>

  <!-- 3. 随机游走轨迹 (模拟数据) -->
  <!-- 轨迹 1 (青色) -->
  <path d="M 50 225 L 80 210 L 110 230 L 140 200 L 170 215 L 200 180 L 230 190 L 260 160 L 290 175 L 320 140 L 350 160 L 380 130 L 410 150 L 440 120 L 470 140 L 500 110 L 530 130 L 560 100 L 590 120 L 620 90 L 650 110 L 680 80 L 710 100 L 740 70" 
        fill="none" stroke="url(#line-gradient-1)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>

  <!-- 轨迹 2 (粉色) -->
  <path d="M 50 225 L 90 240 L 130 220 L 170 250 L 210 230 L 250 260 L 290 280 L 330 260 L 370 290 L 410 320 L 450 300 L 490 330 L 530 310 L 570 340 L 610 320 L 650 350 L 690 330 L 730 360 L 770 340" 
        fill="none" stroke="url(#line-gradient-2)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>

  <!-- 轨迹 3 (绿色 - 主趋势) -->
  <path d="M 50 225 L 75 225 L 100 215 L 125 235 L 150 225 L 175 245 L 200 235 L 225 220 L 250 240 L 275 230 L 300 220 L 325 210 L 350 225 L 375 205 L 400 215 L 425 200 L 450 210 L 475 195 L 500 205 L 525 190 L 550 200 L 575 180 L 600 195 L 625 175 L 650 185 L 675 165 L 700 180 L 725 160 L 750 170" 
        fill="none" stroke="url(#line-gradient-3)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 4. 文字内容 -->
  <g filter="url(#text-shadow)" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- 主标题 -->
    <text x="400" y="240" text-anchor="middle" font-size="64" font-weight="bold" fill="#ffffff" letter-spacing="2">
      Stochastic Processes
    </text>
    
    <!-- 副标题 -->
    <text x="400" y="290" text-anchor="middle" font-size="28" font-weight="300" fill="#94a3b8" letter-spacing="4">
      FINAL EXAM REVIEW
    </text>

    <!-- 底部装饰性公式 -->
    <text x="400" y="420" text-anchor="middle" font-size="14" font-family="Times New Roman, serif" font-style="italic" fill="#64748b" opacity="0.7">
      X(t) = X(0) + ∫ σ(s)dW(s) + ∫ μ(s)ds
    </text>
  </g>
</svg>
