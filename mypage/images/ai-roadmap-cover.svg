<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- 背景渐变 -->
        <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
        </linearGradient>
        <!-- 装饰光点 -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- 背景 -->
    <rect width="100%" height="100%" fill="url(#bg-gradient)" />

    <!-- 抽象神经网络背景网格 -->
    <g stroke="#334155" stroke-width="1" opacity="0.4">
        <line x1="50" y1="50" x2="200" y2="150" />
        <line x1="200" y1="150" x2="400" y2="100" />
        <line x1="400" y1="100" x2="600" y2="300" />
        <line x1="600" y1="300" x2="750" y2="200" />
        <line x1="100" y1="350" x2="200" y2="150" />
        <line x1="400" y1="100" x2="350" y2="350" />
        <line x1="600" y1="300" x2="500" y2="400" />
    </g>

    <!-- 核心文字 -->
    <text x="400" y="200" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="bold" fill="#f8fafc" text-anchor="middle" filter="url(#glow)">
        AI ROADMAP
    </text>
    <text x="400" y="250" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="300" fill="#94a3b8" text-anchor="middle" letter-spacing="4">
        MY SOPHOMORE YEAR
    </text>

    <!-- 装饰性圆点 -->
    <circle cx="50" cy="50" r="4" fill="#38bdf8" opacity="0.6" />
    <circle cx="200" cy="150" r="4" fill="#38bdf8" opacity="0.6" />
    <circle cx="400" cy="100" r="4" fill="#38bdf8" opacity="0.6" />
    <circle cx="600" cy="300" r="4" fill="#38bdf8" opacity="0.6" />
    <circle cx="750" cy="200" r="4" fill="#38bdf8" opacity="0.6" />
    <circle cx="100" cy="350" r="4" fill="#38bdf8" opacity="0.6" />
    <circle cx="350" cy="350" r="4" fill="#38bdf8" opacity="0.6" />

    <!-- 进度条装饰 -->
    <rect x="250" y="280" width="300" height="4" rx="2" fill="#334155" />
    <rect x="250" y="280" width="100" height="4" rx="2" fill="#38bdf8" filter="url(#glow)" />
</svg>
