<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc"/>
            <stop offset="100%" stop-color="#e2e8f0"/>
        </linearGradient>
    </defs>
    
    <!-- 背景 -->
    <rect width="100%" height="100%" fill="#1e293b"/>

    <!-- 平板设备 -->
    <g transform="translate(150, 80)">
        <rect x="0" y="0" width="300" height="220" rx="15" fill="#334155" stroke="#475569" stroke-width="4"/>
        <rect x="15" y="15" width="270" height="190" rx="5" fill="url(#screen-grad)"/>
        
        <!-- 画板上的简笔画：苹果 -->
        <path d="M110 80 Q 90 60 70 80 Q 50 100 70 140 Q 90 160 150 160 Q 210 160 230 140 Q 250 100 230 80 Q 210 60 190 80 Q 150 100 110 80" 
              fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M150 80 Q 160 50 180 40" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
        
        <!-- 手写笔模拟 -->
        <path d="M200 120 L280 200 L290 190 L210 110 Z" fill="#94a3b8"/>
        <circle cx="200" cy="120" r="3" fill="#3b82f6"/>
    </g>

    <!-- AI 识别气泡 -->
    <g transform="translate(500, 100)">
        <!-- 气泡背景 -->
        <path d="M0 0 L180 0 L180 100 L40 100 L0 140 L10 100 L0 100 Z" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
        
        <!-- 识别文字 -->
        <text x="90" y="40" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="24" fill="white">Apple</text>
        
        <!-- 置信度进度条 -->
        <rect x="30" y="60" width="120" height="10" rx="5" fill="#1e40af"/>
        <rect x="30" y="60" width="115" height="10" rx="5" fill="#4ade80"/> <!-- 95% -->
        <text x="165" y="70" font-family="monospace" font-size="12" fill="white">99%</text>
    </g>

    <!-- 装饰：连接线 -->
    <path d="M420 175 L500 175" stroke="#64748b" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- 底部标题 -->
    <text x="400" y="380" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="36" fill="white">
        AI Doodle Classifier
    </text>
    <text x="400" y="420" text-anchor="middle" font-family="monospace" font-size="16" fill="#94a3b8">
        CNN + ONNX Runtime Web
    </text>
</svg>
