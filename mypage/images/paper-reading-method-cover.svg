<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Paper Reading Method Cover</title>
  <desc id="desc">A three-pass research paper reading method shown as annotated pages.</desc>
  <rect width="960" height="540" fill="#fff8f3"/>
  <g filter="url(#shadow)">
    <rect x="134" y="88" width="230" height="334" rx="10" fill="#fff" stroke="#d7ccc8" stroke-width="3" transform="rotate(-4 249 255)"/>
    <rect x="366" y="76" width="230" height="334" rx="10" fill="#fff" stroke="#d7ccc8" stroke-width="3"/>
    <rect x="598" y="92" width="230" height="334" rx="10" fill="#fff" stroke="#d7ccc8" stroke-width="3" transform="rotate(4 713 259)"/>
  </g>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="4" dy="6" stdDeviation="0" flood-color="#d7ccc8" flood-opacity="0.85"/>
    </filter>
  </defs>
  <g font-family="Noto Sans SC, Arial, sans-serif" fill="#5d4037">
    <text x="154" y="156" font-size="26" font-weight="700" transform="rotate(-4 154 156)">Pass 1</text>
    <text x="392" y="144" font-size="26" font-weight="700">Pass 2</text>
    <text x="620" y="160" font-size="26" font-weight="700" transform="rotate(4 620 160)">Pass 3</text>
    <text x="154" y="198" font-size="16" transform="rotate(-4 154 198)">problem</text>
    <text x="154" y="228" font-size="16" transform="rotate(-4 154 228)">claim</text>
    <text x="154" y="258" font-size="16" transform="rotate(-4 154 258)">result</text>
    <text x="392" y="188" font-size="16">data flow</text>
    <text x="392" y="218" font-size="16">modules</text>
    <text x="392" y="248" font-size="16">loss</text>
    <text x="620" y="202" font-size="16" transform="rotate(4 620 202)">formula</text>
    <text x="620" y="232" font-size="16" transform="rotate(4 620 232)">ablation</text>
    <text x="620" y="262" font-size="16" transform="rotate(4 620 262)">reproduce</text>
  </g>
  <text x="128" y="478" font-family="Noto Sans SC, Arial, sans-serif" font-size="34" font-weight="700" fill="#5d4037">Read Papers in Layers</text>
</svg>
