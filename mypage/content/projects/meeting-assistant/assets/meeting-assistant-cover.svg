<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MeetingAssistant project cover</title>
  <desc id="desc">A dark interface-inspired cover with blue and purple audio waveforms.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#171a24"/>
      <stop offset="1" stop-color="#251442"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43c8ff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d268ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#218bff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#218bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="54" fill="url(#background)"/>
  <rect width="1600" height="900" rx="54" fill="url(#grid)"/>
  <circle cx="330" cy="460" r="390" fill="url(#glowBlue)"/>
  <circle cx="1280" cy="390" r="430" fill="url(#glowPurple)"/>

  <g transform="translate(118 104)">
    <rect width="1364" height="692" rx="40" fill="#0b0f18" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".08"/>
    <circle cx="44" cy="42" r="7" fill="#ff6b6b"/>
    <circle cx="70" cy="42" r="7" fill="#ffd166"/>
    <circle cx="96" cy="42" r="7" fill="#63df92"/>
    <text x="124" y="50" fill="#99a5b9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" letter-spacing="3">LOCAL MEETING INTELLIGENCE</text>

    <g transform="translate(88 173)">
      <rect x="0" y="126" width="42" height="102" rx="21" fill="url(#blue)"/>
      <rect x="76" y="82" width="54" height="190" rx="27" fill="url(#blue)"/>
      <rect x="164" y="24" width="58" height="306" rx="29" fill="url(#blue)"/>
      <rect x="256" y="-28" width="64" height="410" rx="32" fill="url(#blue)"/>
      <rect x="354" y="66" width="54" height="222" rx="27" fill="url(#blue)"/>

      <g fill="#f7f9ff">
        <rect x="478" y="95" width="214" height="32" rx="16"/>
        <rect x="478" y="161" width="168" height="32" rx="16"/>
        <rect x="478" y="227" width="214" height="32" rx="16"/>
      </g>

      <rect x="770" y="66" width="54" height="222" rx="27" fill="url(#purple)"/>
      <rect x="858" y="-28" width="64" height="410" rx="32" fill="url(#purple)"/>
      <rect x="956" y="24" width="58" height="306" rx="29" fill="url(#purple)"/>
      <rect x="1048" y="82" width="54" height="190" rx="27" fill="url(#purple)"/>
      <rect x="1136" y="126" width="42" height="102" rx="21" fill="url(#purple)"/>
    </g>

    <g transform="translate(88 590)">
      <text fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="43" font-weight="700">MeetingAssistant</text>
      <text x="0" y="48" fill="#9ca8ba" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" letter-spacing="1.5">TRANSCRIBE  /  SUMMARIZE  /  ACT</text>
      <g transform="translate(1014 4)">
        <circle cx="16" cy="16" r="16" fill="#30c9ff" filter="url(#shadow)"/>
        <circle cx="16" cy="16" r="7" fill="#b7edff"/>
        <text x="46" y="24" fill="#d7dee9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22">LOCAL FIRST</text>
      </g>
    </g>
  </g>
</svg>
