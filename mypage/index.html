<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fangwenky の blog - 个人主页</title>
    <meta name="description" content="Fangwenky 的个人博客，记录学习笔记、技术分享和项目展示。主要涵盖机器学习、深度学习、Python 编程等技术领域。">
    <meta name="author" content="Fangwenky">
    <meta property="og:title" content="Fangwenky の blog - 个人主页">
    <meta property="og:description" content="Fangwenky 的个人博客，记录学习笔记、技术分享和项目展示。">
    <meta property="og:image" content="images/avatar.jpg">
    <meta property="og:url" content="https://fangwenky.github.io/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="images/avatar.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body id="home-page">
    <div class="loading-screen">
        <div class="loader"></div>
    </div>

    <header class="header">
        <nav class="nav">
            <div class="nav-logo">
                <a href="about.html" class="logo-link">
                    <img src="images/avatar.jpg" alt="头像" class="avatar" width="42" height="42">
                    <span>F_wenky的个人主页</span>
                </a>
            </div>

            <div class="nav-links" id="primaryNav">
                <a href="#home" class="active">首页</a>
                <a href="articles.html">文章</a>
                <a href="projects.html">项目</a>
                <a href="archive.html">归档</a>
                <a href="about.html">关于我</a>
                <a href="search.html">搜索</a>
            </div>
            <button class="nav-toggle" type="button" aria-label="打开导航菜单" aria-expanded="false" aria-controls="primaryNav">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main>
        <section id="home" class="slider-section">
            <div class="slider-container">
                <div class="slider-wrapper">
                    <div class="slider-cards">
                    </div>
                </div>
                <div class="slider-nav">
                    <button class="prev-btn" type="button" aria-label="上一张精选内容"><i class="fas fa-chevron-left" aria-hidden="true"></i></button>
                    <div class="slider-dots">
                        <!-- 点将通过JavaScript动态添加 -->
                    </div>
                    <button class="next-btn" type="button" aria-label="下一张精选内容"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>
                </div>
                <div class="polaroid-caption">📸 精选内容</div>
            </div>
        </section>

        <section id="latest-articles" class="articles-section">
            <h2>最新文章</h2>
            <div class="articles-grid">
                <!-- 文章卡片将通过JavaScript动态添加 -->
            </div>
            <div class="section-footer">
                <a href="articles.html" class="btn view-all-btn">查看所有文章</a>
            </div>
        </section>

        <section id="featured-projects" class="projects-section">
            <h2>精选项目</h2>
            <div class="projects-grid">
                <!-- 项目卡片将通过JavaScript动态添加 -->
            </div>
            <div class="section-footer">
                <a href="projects.html" class="btn view-all-btn">查看所有项目</a>
            </div>
        </section>

        <section class="about-section" id="about">
            <div class="about-header">
                <div class="about-image">
                </div>
                <div class="about-text">
                </div>
            </div>

            <div class="about-content">
                <div class="experience-section">
                    <h2>工作经历</h2>
                    <div class="timeline">
                    </div>
                </div>

                <div class="interests-section">
                    <h2>兴趣爱好</h2>
                    <div class="interests-grid">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>联系方式</h3>
                <div class="social-links">
                </div>
            </div>
            <div class="footer-section">
                <h3>快速链接</h3>
                <ul>
                    <li><a href="articles.html">所有文章</a></li>
                    <li><a href="projects.html">项目展示</a></li>
                    <li><a href="about.html">关于我</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; F_wenky 的个人主页. All rights reserved.</p>
        </div>
    </footer>

    <div class="search-overlay" id="searchOverlay">
        <div class="search-container">
            <div class="search-header">
                <h2>搜索结果</h2>
                <button class="close-search" id="closeSearch" type="button" aria-label="关闭搜索结果">&times;</button>
            </div>
            <div class="search-results" id="searchResults">
                <!-- 搜索结果将通过JavaScript动态添加 -->
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
