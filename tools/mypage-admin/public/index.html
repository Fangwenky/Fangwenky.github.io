<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mypage 文章管理</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-mark">文</span>
                <div>
                    <h1>文章管理</h1>
                    <p>Markdown Publishing Desk</p>
                </div>
            </div>

            <div class="toolbar">
                <button id="newArticle" type="button">新建</button>
                <button id="refreshArticles" type="button">刷新</button>
            </div>

            <div class="filters">
                <input id="filterInput" type="search" placeholder="筛选标题、标签、分类">
                <select id="statusFilter">
                    <option value="">全部状态</option>
                    <option value="published">已发布</option>
                    <option value="draft">草稿</option>
                    <option value="invalid">异常</option>
                </select>
            </div>

            <div id="articleList" class="article-list"></div>
        </aside>

        <main class="editor-panel">
            <header class="topbar">
                <div>
                    <span id="currentState" class="state-pill">未选择文章</span>
                    <h2 id="editorTitle">选择或新建一篇文章</h2>
                </div>
                <div class="actions">
                    <button id="saveArticle" type="button">保存草稿</button>
                    <button id="generateSite" type="button">生成静态数据</button>
                    <button id="publishArticle" type="button" class="primary">发布并推送</button>
                </div>
            </header>

            <section class="meta-grid">
                <label>文章 ID<input id="articleId" autocomplete="off"></label>
                <label>发布日期<input id="articleDate" type="date"></label>
                <label>分类<input id="articleCategory" autocomplete="off"></label>
                <label>阅读时长<input id="articleReadTime" autocomplete="off"></label>
                <label class="wide">封面路径<input id="articleCover" autocomplete="off" placeholder="images/example.svg"></label>
                <label>状态
                    <select id="articleStatus">
                        <option value="draft">草稿</option>
                        <option value="published">已发布</option>
                    </select>
                </label>
                <label class="wide">中文标题<input id="zhTitle" autocomplete="off"></label>
                <label class="wide">英文标题<input id="enTitle" autocomplete="off"></label>
                <label class="wide">中文摘要<textarea id="zhExcerpt" rows="3"></textarea></label>
                <label class="wide">英文摘要<textarea id="enExcerpt" rows="3"></textarea></label>
                <label class="wide">中文标签<input id="zhTags" autocomplete="off" placeholder="人工智能, 学习笔记"></label>
                <label class="wide">英文标签<input id="enTags" autocomplete="off" placeholder="AI, Notes"></label>
            </section>

            <section class="language-tabs" aria-label="正文语言">
                <button class="tab active" type="button" data-lang="zh">中文正文</button>
                <button class="tab" type="button" data-lang="en">英文正文</button>
                <label class="upload-button">
                    插入图片
                    <input id="imageUpload" type="file" accept="image/*">
                </label>
            </section>

            <section class="workspace">
                <textarea id="markdownEditor" spellcheck="false" placeholder="在这里写 Markdown..."></textarea>
                <article id="preview" class="preview"></article>
            </section>

            <footer class="statusbar">
                <span id="message">准备就绪</span>
            </footer>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
