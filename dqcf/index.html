<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>2021级1班 · 毕业纪念站</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 阅读进度条 -->
  <div class="read-progress" id="readProgress"></div>

  <!-- 导航 -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="#" class="nav-logo">2021级1班</a>
      <ul class="nav-menu">
        <li><a href="#hero" class="nav-link active">首页</a></li>
        <li><a href="#destinations" class="nav-link">毕业去向</a></li>
        <li><a href="#map" class="nav-link">蹭饭地图</a></li>
        <li><a href="words.html" class="nav-link">留言墙</a></li>
      </ul>
      <button class="nav-toggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- 首屏 -->
  <section id="hero" class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <p class="hero-label">2021级1班</p>
      <h1 class="hero-title">我们毕业啦</h1>
      <p class="hero-desc">无论身在何方，心永远连在一起</p>
      <div class="hero-stats">
        <div class="hero-stat">
          <span class="hero-stat-num" data-target="55">0</span>
          <span class="hero-stat-label">位师生</span>
        </div>
        <div class="hero-stat">
          <span class="hero-stat-num" data-target="11">0</span>
          <span class="hero-stat-label">个省市</span>
        </div>
        <div class="hero-stat">
          <span class="hero-stat-num" data-target="30">0</span>
          <span class="hero-stat-label">所高校</span>
        </div>
      </div>
      <a href="#destinations" class="hero-cta">
        <span>查看去向</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
      </a>
    </div>
    <div class="hero-scrollhint">
      <span>向下滚动</span>
      <div class="hero-scrollline"></div>
    </div>
  </section>

  <!-- 省份快捷导航 -->
  <div class="province-nav" id="provinceNav">
    <div class="province-nav-inner">
      <button class="province-nav-btn active" data-province="all">全部</button>
      <!-- JS 填充 -->
    </div>
  </div>

  <!-- 毕业去向 -->
  <section id="destinations" class="destinations">
    <div class="section-head reveal">
      <h2 class="section-title">毕业去向</h2>
      <p class="section-subtitle">天南地北，各自精彩</p>
    </div>
    <div id="destinationsContent">
      <!-- JS 按省份+学校分组填充 -->
    </div>
  </section>

  <!-- 蹭饭地图 -->
  <section id="map" class="map-section">
    <div class="section-head reveal">
      <h2 class="section-title">蹭饭地图</h2>
      <p class="section-subtitle">点击省份标签，快速定位同学</p>
    </div>
    <div class="map-wrap reveal">
      <img src="images/map.png" alt="蹭饭地图" loading="lazy">
    </div>
  </section>

  <!-- 留言 -->
  <section id="message" class="message-section">
    <div class="section-head reveal">
      <h2 class="section-title">聆听我们的声音</h2>
      <p class="section-subtitle">留下你想说的话，让回忆永不褪色</p>
    </div>
    <div class="message-card reveal">
      <div class="message-quote">"</div>
      <p class="message-text">写下这些话的时候，正是又一年高考录取的季节……我们都有着光耀的青春和前程，祝你们诸事顺遂，前程似锦。</p>
      <p class="message-author">—— 房砖砖</p>
      <a href="words.html" class="btn-outline">进入留言墙</a>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="site-footer">
    <p>© 2025 2021级1班毕业纪念站</p>
    <p class="site-footer-sub">青春不散场，我们更高处见</p>
  </footer>

  <a href="#hero" class="backtop" id="backtop" aria-label="回到顶部">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
  </a>

  <script src="script.js"></script>
</body>
</html>
